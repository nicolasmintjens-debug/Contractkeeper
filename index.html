<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>ContractKeeper</title>

    <meta name="theme-color" content="#0F172A">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ContractKeeper">

    <link rel="manifest" href="manifest.json">

    <link rel="apple-touch-icon" href="assets/icon-192.png">
    <link rel="icon" href="assets/icon-192.png">

    <link rel="stylesheet" href="style.css">

    <script src="https://kit.fontawesome.com/6d4a5d6e7a.js" crossorigin="anonymous"></script>
</head>
<body>

<div class="app">

    <!-- Header -->
    <header id="home-header" class="header">

        <img src="assets/logo.png" class="logo" alt="ContractKeeper">

        <div class="welcome">
            <h2>Goedemorgen 👋</h2>
            <p>Welkom bij ContractKeeper</p>
        </div>

    </header>

    <!-- Dashboard -->
    <main id="screen-home">

        <section class="stats">

            <div class="card">
                <span class="label">Maandelijkse kosten</span>
                <h1>€0,00</h1>
            </div>

            <div class="mini-cards">

                <div class="mini-card">
                    <span>Actieve contracten</span>
                    <h2>0</h2>
                </div>

                <div class="mini-card">
                    <span>Binnen 30 dagen</span>
                    <h2>0</h2>
                </div>

            </div>

        </section>

        <section class="section">

            <h3>Binnenkort aflopend</h3>

            <div class="empty-card">
                Geen contracten gevonden
            </div>

        </section>

        <section class="section">

            <h3>Mijn contracten</h3>

            <div id="contracts">

                <div class="contract-card">

                    <div>

                        <h4>Netflix</h4>
                        <p>Entertainment</p>

                    </div>

                    <div class="price">

                        €14,99

                    </div>

                </div>

                <div class="contract-card">

                    <div>

                        <h4>Proximus</h4>
                        <p>Internet</p>

                    </div>

                    <div class="price">

                        €69,99

                    </div>

                </div>

            </div>

        </section>

    </main>

    <!-- Nieuw contract -->

<div id="addContractModal" class="modal">

    <div class="modal-content">

        <div class="modal-handle"></div>

        <h2>Nieuw contract</h2>

        <form id="contractForm">

            <label>Naam</label>
            <input type="text" id="name" required>

            <label>Leverancier</label>
            <input type="text" id="supplier">

            <label>Categorie</label>

            <select id="category">

                <option>Streaming</option>
                <option>Internet</option>
                <option>Verzekering</option>
                <option>Telefonie</option>
                <option>Software</option>
                <option>Bank</option>
                <option>Overig</option>

            </select>

            <label>Bedrag (€)</label>
            <input type="number" id="amount" step="0.01">

            <label>Frequentie</label>

            <select id="frequency">

                <option value="monthly">Maandelijks</option>
                <option value="yearly">Jaarlijks</option>

            </select>

            <label>Einddatum</label>
            <input type="date" id="endDate">

            <label>Notities</label>

            <textarea id="notes"></textarea>

            <button type="submit" class="save-button">

                Contract opslaan

            </button>

        </form>

    </div>

</div>
    
    <!-- Navigatie -->

    <nav class="bottom-nav">

    <button id="nav-home" class="active">
        <i class="fas fa-house"></i>
        <span>Overzicht</span>
    <button type="button">

    <button id="nav-contracts">
        <i class="fas fa-file-contract"></i>
        <span>Contracten</span>
    <button type="button">

    <button id="nav-add" class="add-button">
        <i class="fas fa-plus"></i>
    <button type="button">

    <button id="nav-calendar">
        <i class="fas fa-calendar"></i>
        <span>Kalender</span>
    <button type="button">

    <button id="nav-profile">
        <i class="fas fa-user"></i>
        <span>Profiel</span>
    <button type="button">

</nav>
    
</div>

<script src="app.js"></script>

</body>
</html>
