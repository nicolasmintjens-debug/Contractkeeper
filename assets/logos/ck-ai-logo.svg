<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A1E27"/>
      <stop offset="100%" stop-color="#11151D"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bg)"/>

  <!-- Open circular arc -->
  <path d="M160 370
           A150 150 0 1 1 360 140"
        fill="none"
        stroke="#2CE58D"
        stroke-width="14"
        stroke-linecap="round"
        filter="url(#glow)"/>

  <!-- Sparkle -->
  <g transform="translate(365 132)" stroke="#2CE58D" stroke-width="6" stroke-linecap="round" filter="url(#glow)">
    <line x1="0" y1="-14" x2="0" y2="14"/>
    <line x1="-14" y1="0" x2="14" y2="0"/>
    <line x1="-10" y1="-10" x2="10" y2="10"/>
    <line x1="-10" y1="10" x2="10" y2="-10"/>
  </g>

  <!-- CK -->
  <text x="150" y="280"
        font-family="Inter, SF Pro Display, Arial, sans-serif"
        font-size="128"
        font-weight="800"
        fill="#FFFFFF">CK</text>

  <!-- AI -->
  <text x="310" y="340"
        font-family="Inter, SF Pro Display, Arial, sans-serif"
        font-size="54"
        font-weight="700"
        fill="#2CE58D">AI</text>
</svg>
